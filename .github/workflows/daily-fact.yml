name: Daily Scotland Fact

on:
  schedule:
    - cron: '15 10 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate and validate without sending SMS'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: scotland-facts-send
  cancel-in-progress: false

jobs:
  daily-fact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
      TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      RECIPIENT_NUMBER: ${{ secrets.RECIPIENT_NUMBER }}
      FATHER_IN_LAW_NUMBER: ${{ secrets.FATHER_IN_LAW_NUMBER }}
      SMS_SEND_ENABLED: ${{ vars.SMS_SEND_ENABLED || 'false' }}
      RECIPIENT_CONSENT_CONFIRMED: ${{ vars.RECIPIENT_CONSENT_CONFIRMED || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Explain disabled production delivery
        if: (github.event_name == 'schedule' || !inputs.dry_run) && (env.SMS_SEND_ENABLED != 'true' || env.RECIPIENT_CONSENT_CONFIRMED != 'true')
        shell: python
        run: |
          import os
          from pathlib import Path
          message = "SMS delivery is paused: SMS_SEND_ENABLED and RECIPIENT_CONSENT_CONFIRMED must both be true. No SMS will be sent."
          print("::warning::" + message)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("## Delivery paused\n\n" + message + "\n")
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              raise SystemExit("Requested production run is blocked by delivery switches.")
      - name: Install package and test dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Run tests
        run: pytest
      - name: Run non-live doctor checks
        run: python -m scotland_facts.cli doctor
      - name: Run scheduled production delivery
        if: github.event_name == 'schedule' && env.SMS_SEND_ENABLED == 'true' && env.RECIPIENT_CONSENT_CONFIRMED == 'true'
        run: python -m scotland_facts.cli run
      - name: Run manual dry-run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: python -m scotland_facts.cli run --dry-run
      - name: Run manual production delivery
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && env.SMS_SEND_ENABLED == 'true' && env.RECIPIENT_CONSENT_CONFIRMED == 'true'
        run: python -m scotland_facts.cli run
